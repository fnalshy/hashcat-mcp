[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hashcat-mcp"
version = "2.0.0"
description = "Cross-platform stdio MCP server that wraps hashcat for any MCP-capable agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hashcat-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "hashcat", "password", "cracking", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hashcat-mcp = "hashcat_mcp.server:main"

[project.urls]
Homepage = "https://github.com/fnalshy/hashcat-mcp"
Source = "https://github.com/fnalshy/hashcat-mcp"

[tool.setuptools]
packages = ["hashcat_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
